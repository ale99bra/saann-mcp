[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saann-mcp"
version = "0.1.0"
description = "A local MCP server for the SaANN machine learning library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3.0",
    "numpy>=2.0,<3.0",
    "pandas>=3.0,<4.0",
    "saann @ git+https://github.com/ale99bra/SaANN.git",
]

[project.scripts]
saann-mcp = "server:main"

[dependency-groups]
dev = [
    "pillow>=12.0,<13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]
